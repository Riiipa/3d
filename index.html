        /* Базові налаштування (Мінімалізм) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Жорстке блокування горизонтального скролу для ВСІХ пристроїв */
        html, body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            font-family: 'Jost', sans-serif;
            font-weight: 400; /* Базова товщина - Regular */
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка сайту */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem 1rem 1rem;
            gap: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            margin-top: 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 400; 
            letter-spacing: 2px;
            transition: color 0.3s ease;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .logo h1 {
            font-size: 2.5rem;
            line-height: 0.9;
            font-weight: 300; 
            letter-spacing: 5px;
            text-align: center;
            cursor: pointer;
        }

        .logo-img {
            max-height: 50px;
            width: auto;
            cursor: pointer;
            display: block;
        }

        /* Сторінка контактів */
        .contact-info {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .contact-text {
            margin-bottom: 3rem;
            color: #999;
            font-size: 1.1rem;
            font-weight: 300; 
        }

        .contact-details {
            color: #fff;
            font-size: 1rem;
            font-weight: 300; 
            line-height: 2;
            letter-spacing: 1.5px;
        }

        .contact-details a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-details a:hover {
            color: #666;
        }

        /* Головна секція */
        main {
            flex: 1;
            padding: 2rem 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Логіка перемикання сторінок */
        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro {
            text-align: center;
            margin-bottom: 5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* ДОДАНО: Стилі для твого імені як бренду */
        .intro-name {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .intro-role {
            color: #aaaaaa;
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .intro-location {
            color: #666666;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* Сітка категорій (Головна сторінка) */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .category-card {
            position: relative;
            display: block;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            text-decoration: none;
            background-color: #111;
            cursor: pointer;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            /* Примусове апаратне згладжування GPU (Anti-aliasing) */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
        }

        .category-card .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            transition: opacity 0.4s ease;
        }

        .category-card .overlay h2 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            transform: translateY(15px);
            transition: transform 0.4s ease;
        }

        .category-card:hover img {
            transform: scale(1.05) translateZ(0);
            filter: grayscale(0%);
        }

        .category-card:hover .overlay {
            opacity: 1;
        }

        .category-card:hover .overlay h2 {
            transform: translateY(0);
        }

        /* Галерея (для сторінок проектів) */
        .page-title {
            margin-bottom: 3rem;
            font-weight: 300; /* Виправлено синтаксичну помилку */
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
        }

        /* НОВИЙ CSS ДЛЯ ГАЛЕРЕЇ З ОБГОРТКАМИ */
        .gallery-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden; 
            background-color: #111;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            display: block;
            
            /* Апаратне прискорення */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            transform: translateZ(0);
            
            /* Транзиції як на головній сторінці для єдиного стилю */
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.03) translateZ(0);
        }

        /* --- ЛАЙТБОКС (МОДАЛЬНЕ ВІКНО) --- */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.show {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: zoomIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #888;
            font-size: 50px;
            font-weight: 200;
            cursor: pointer;
            transition: color 0.3s ease;
            line-height: 1;
        }

        .lightbox-close:hover {
            color: #fff;
        }
        
        /* ДОДАНО: Навігація в лайтбоксі (стрілки) */
        .lightbox-prev, .lightbox-next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 40px;
            font-weight: 200;
            cursor: pointer;
            transition: color 0.3s ease;
            padding: 20px;
            user-select: none;
            z-index: 1001;
        }

        .lightbox-prev:hover, .lightbox-next:hover {
            color: #fff;
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }
        /* Футер */
        footer {
            text-align: center;
            padding: 3rem;
            color: #444;
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 1.5px;

        }

            height: 20px;

        /* Адаптивність для телефонів */
        @media (max-width: 900px) {

                gap: 1rem;
                width: 100%;

                grid-template-columns: 1fr;
                max-width: 100%;
            }
            .category-card .overlay {
                opacity: 1;
                background: rgba(0, 0, 0, 0.4);
            }
            .category-card .overlay h2 {
                transform: translateY(0);
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
            }
            .gallery-grid img {
                filter: grayscale(0%);
            }
            main {
                padding: 1rem;
                width: 100%;
            }
            .lightbox-close {
                top: 15px;
                right: 20px;
                font-size: 40px;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('[data-target]');
            const pages = document.querySelectorAll('.page');
            const navLinks = document.querySelectorAll('.nav-links a[data-target]');

            links.forEach(link => {
                link.addEventListener('click', () => {
                    const targetId = link.getAttribute('data-target');
                    if (!targetId) return;

                    pages.forEach(page => page.classList.remove('active'));
                    
                    const targetPage = document.getElementById(targetId);
                    if(targetPage) {
                        targetPage.classList.add('active');
                    }

                    navLinks.forEach(nav => nav.classList.remove('active'));
                    const activeNavLink = document.querySelector(`.nav-links a[data-target="${targetId}"]`);
                    if(activeNavLink) {
                        activeNavLink.classList.add('active');
                    }

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const closeBtn = document.querySelector('.lightbox-close');
            const galleryImages = document.querySelectorAll('.gallery-grid img[data-full]');

            // ДОДАНО: Стан слайдера
            let currentGallery = [];
            let currentIndex = 0;

            galleryImages.forEach(img => {
                img.addEventListener('click', () => {
                    lightbox.classList.add('show');
                    
                    // ВИПРАВЛЕНО: Збираємо всі картинки ТІЛЬКИ з поточного відкритого розділу
                    const activeSection = img.closest('.page');
                    currentGallery = Array.from(activeSection.querySelectorAll('.gallery-grid img[data-full]'));
                    currentIndex = currentGallery.indexOf(img);
                    
                    updateLightboxImage();
                });
            });

            // ДОДАНО: Функція оновлення картинки
            const updateLightboxImage = () => {
                if (currentGallery.length === 0) return;
                const fullResUrl = currentGallery[currentIndex].getAttribute('data-full');
                lightboxImg.src = fullResUrl;
            };

            // ДОДАНО: Логіка перемикання вперед/назад із зацикленням
            const nextImage = (e) => {
                if (e) e.stopPropagation();
                currentIndex = (currentIndex + 1) % currentGallery.length;
                updateLightboxImage();
            };

            const prevImage = (e) => {
                if (e) e.stopPropagation();
                currentIndex = (currentIndex - 1 + currentGallery.length) % currentGallery.length;
                updateLightboxImage();
            };

            const closeLightbox = () => {
                lightbox.classList.remove('show');
                setTimeout(() => { lightboxImg.src = ''; }, 300); 
            };

            closeBtn.addEventListener('click', closeLightbox);
            
            // ДОДАНО: Обробники кліків по стрілках
            document.querySelector('.lightbox-next').addEventListener('click', nextImage);
            document.querySelector('.lightbox-prev').addEventListener('click', prevImage);

            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('show')) return;
                
                if (e.key === 'Escape') closeLightbox();
                // ДОДАНО: Керування клавіатурою
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
            });

            // ДОДАНО: Обробка свайпів для смартфонів та планшетів
            let touchStartX = 0;
            let touchEndX = 0;

            lightbox.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            lightbox.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            const handleSwipe = () => {
                const swipeThreshold = 50; // Мінімальна довжина свайпу в пікселях
                if (touchEndX < touchStartX - swipeThreshold) nextImage();
                if (touchEndX > touchStartX + swipeThreshold) prevImage();
            };
        });
    </script>
</body>
</html>
