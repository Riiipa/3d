<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dmytro Ripa | 3D Artist & Interior Designer</title>
    <style>
        /* Базові налаштування (Мінімалізм) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #080808; /* Глибокий чорний фон */
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Шапка сайту */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 2.5rem 5rem;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            margin-top: 0.5rem;
        }

        .nav-links a {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
            text-transform: uppercase;
            cursor: pointer;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .logo h1 {
            font-size: 2.2rem;
            line-height: 0.9;
            font-weight: 700;
            letter-spacing: 3px;
            text-align: left;
            cursor: pointer;
        }

        /* Головна секція */
        main {
            flex: 1;
            padding: 2rem 5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Логіка перемикання сторінок */
        .page {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .intro {
            text-align: center;
            margin-bottom: 5rem;
            color: #999;
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* Сітка категорій (Головна сторінка) */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .category-card {
            position: relative;
            display: block;
            overflow: hidden;
            aspect-ratio: 3 / 4; /* Строга портретна орієнтація */
            text-decoration: none;
            background-color: #111;
            cursor: pointer;
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%); /* Робить рендери чорно-білими за замовчуванням */
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.6s ease;
        }

        .category-card .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0; 
            transition: opacity 0.4s ease;
        }

        .category-card .overlay h2 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            transform: translateY(15px);
            transition: transform 0.4s ease;
        }

        /* Ефекти наведення для категорій */
        .category-card:hover img {
            transform: scale(1.05);
            filter: grayscale(0%); /* Повертаємо колір при наведенні (можеш залишити 100%, якщо хочеш завжди ч/б) */
        }

        .category-card:hover .overlay {
            opacity: 1;
        }

        .category-card:hover .overlay h2 {
            transform: translateY(0);
        }

        /* Галерея (для сторінок проектів) */
        .page-title {
            margin-bottom: 3rem;
            font-weight: 300;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1400px;
        }

        .gallery-grid img {
            width: 100%;
            aspect-ratio: 1 / 1; /* Квадратні прев'ю в галереї (можеш змінити на auto) */
            object-fit: cover;
            display: block;
            transition: opacity 0.3s;
            background-color: #111;
        }

        .gallery-grid img:hover {
            opacity: 0.7;
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 3rem;
            color: #444;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        /* Адаптивність для телефонів */
        @media (max-width: 900px) {
            header {
                flex-direction: column;
                align-items: center;
                gap: 2rem;
                padding: 2rem;
            }
            .categories-grid {
                grid-template-columns: 1fr;
                max-width: 450px;
            }
            main {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav class="nav-links">
            <a data-target="home" class="active">HOME</a>
            <a data-target="interiors">INTERIORS</a>
            <a data-target="architecture">ARCHITECTURE</a>
            <a data-target="details">DETAILS</a>
            <!-- Contact поки просто як текст, бо сторінки для нього ти не просив -->
            <a href="mailto:test@example.com">CONTACT</a>
        </nav>
        <div class="logo">
            <h1 data-target="home">RI<br>PA</h1> 
        </div>
    </header>

    <main>
        <!-- СТОРІНКА: ГОЛОВНА -->
        <div id="home" class="page active">
            <section class="intro">
                <p>Hi, my name is Dmytro Ripa</p>
                <p>I am an Interior Designer and 3D Artist based in Paris</p>
            </section>

            <section class="categories-grid">
                <div class="category-card" data-target="interiors">
                    <!-- Заглушки Unsplash, заміниш на свої -->
                    <img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&q=80" alt="Interiors">
                    <div class="overlay">
                        <h2>Interiors</h2>
                    </div>
                </div>
                <div class="category-card" data-target="architecture">
                    <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80" alt="Architecture">
                    <div class="overlay">
                        <h2>Architecture</h2>
                    </div>
                </div>
                <div class="category-card" data-target="details">
                    <img src="https://images.unsplash.com/photo-1618220179428-22790b46a0eb?auto=format&fit=crop&q=80" alt="Details">
                    <div class="overlay">
                        <h2>Details</h2>
                    </div>
                </div>
            </section>
        </div>

        <!-- СТОРІНКА: ІНТЕР'ЄРИ -->
        <div id="interiors" class="page">
            <h2 class="page-title">Interiors</h2>
            <section class="gallery-grid">
                <img src="https://images.unsplash.com/photo-1600607687920-4e2a09be15b7?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1600566753086-00f18efc2207?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1600210491892-03d54c13c709?auto=format&fit=crop&q=80" alt="Work">
            </section>
        </div>

        <!-- СТОРІНКА: АРХІТЕКТУРА -->
        <div id="architecture" class="page">
            <h2 class="page-title">Architecture</h2>
            <section class="gallery-grid">
                <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80" alt="Work">
            </section>
        </div>

        <!-- СТОРІНКА: ДЕТАЛІ -->
        <div id="details" class="page">
            <h2 class="page-title">Details</h2>
            <section class="gallery-grid">
                <img src="https://images.unsplash.com/photo-1618220179428-22790b46a0eb?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1583847268964-b28dc8f51f92?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80" alt="Work">
                <img src="https://images.unsplash.com/photo-1505691938895-1758d7bef511?auto=format&fit=crop&q=80" alt="Work">
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 by Dmytro Ripa</p>
    </footer>

    <script>
        // Простий JS для перемикання "сторінок"
        document.addEventListener('DOMContentLoaded', () => {
            const links = document.querySelectorAll('[data-target]');
            const pages = document.querySelectorAll('.page');
            const navLinks = document.querySelectorAll('.nav-links a[data-target]');

            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    const targetId = link.getAttribute('data-target');
                    if (!targetId) return;

                    // Ховаємо всі сторінки
                    pages.forEach(page => page.classList.remove('active'));
                    
                    // Показуємо потрібну
                    const targetPage = document.getElementById(targetId);
                    if(targetPage) {
                        targetPage.classList.add('active');
                    }

                    // Оновлюємо активний стан в навігації
                    navLinks.forEach(nav => nav.classList.remove('active'));
                    
                    // Знаходимо лінк в навігації, який відповідає цільовій сторінці, і робимо активним
                    const activeNavLink = document.querySelector(`.nav-links a[data-target="${targetId}"]`);
                    if(activeNavLink) {
                        activeNavLink.classList.add('active');
                    }

                    // Скролимо нагору
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        });
    </script>
</body>
</html>
